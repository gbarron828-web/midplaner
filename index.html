<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDPLANER</title>
<meta name="theme-color" content="#3B5BDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%233B5BDB%22/><path d=%22M30 52l13 13 27-30%22 stroke=%22white%22 stroke-width=%2210%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MIDPLANER v2 — estilos
   ========================================================= */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F6F6F3;
  --surface:#FFFFFF;
  --surface-2:#F0EFEB;
  --line:#E8E6E1;
  --text:#17191E;
  --dim:#676B73;
  --faint:#A3A6AD;
  --accent:#3B5BDB;
  --accent-soft:#ECF0FE;
  --accent-ink:#FFFFFF;
  --p3:#DB3E38;   /* alta  */
  --p2:#E58A0C;   /* media */
  --p1:#3B7BDB;   /* baja  */
  --green:#1E9E62;
  --green-soft:#E5F5ED;
  --red-soft:#FCEBEA;
  --work:#7048E8;
  --work-soft:#F1ECFE;
  --pers:#0B8599;
  --pers-soft:#E3F5F7;
  --radius:14px;
  --shadow:0 1px 2px rgba(18,20,28,.04),0 8px 28px rgba(18,20,28,.08);
  --shadow-lg:0 20px 60px rgba(18,20,28,.22);
}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1A1C21; --surface-2:#22252B; --line:#2A2D34;
  --text:#ECEDEF; --dim:#A0A4AC; --faint:#686C75;
  --accent:#7090FF; --accent-soft:#222A47; --accent-ink:#0B0E1A;
  --green-soft:#13301F; --red-soft:#3A1818; --work-soft:#2A2145; --pers-soft:#10303A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --surface:#1A1C21; --surface-2:#22252B; --line:#2A2D34;
    --text:#ECEDEF; --dim:#A0A4AC; --faint:#686C75;
    --accent:#7090FF; --accent-soft:#222A47; --accent-ink:#0B0E1A;
    --green-soft:#13301F; --red-soft:#3A1818; --work-soft:#2A2145; --pers-soft:#10303A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--text);}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
svg.i.sm{width:14px;height:14px;stroke-width:2;}
::selection{background:var(--accent-soft);}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:248px;flex:0 0 248px;position:sticky;top:0;height:100vh;
  padding:22px 14px;display:flex;flex-direction:column;gap:2px;
  border-right:1px solid var(--line);background:var(--surface);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;}
.brand .logo{width:32px;height:32px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;}
.brand .logo svg{width:18px;height:18px;stroke-width:2.6;}
.brand b{font-size:16px;font-weight:800;letter-spacing:.6px;}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:none;background:none;width:100%;text-align:left;color:var(--dim);font-weight:500;font-size:14.5px;}
.nav:hover{background:var(--surface-2);color:var(--text);}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav .n{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600;}
.nav.on .n{color:var(--accent);}
.nav .n.late{color:var(--p3);}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;}
.side-foot .store{font-size:11.5px;color:var(--faint);padding:8px 12px 0;line-height:1.5;}

#main{flex:1;min-width:0;display:flex;justify-content:center;}
#page{width:100%;max-width:720px;padding:34px 32px 120px;}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;}
.head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;}
.head .subtitle{color:var(--dim);font-size:14px;margin-top:4px;}
.head-btns{display:flex;gap:4px;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:none;background:none;color:var(--dim);display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.only-mobile{display:none!important;}

#tabbar{display:none;}
#fab{display:none;}

@media (max-width: 860px){
  #sidebar{display:none;}
  #page{padding:18px 16px 130px;}
  .head h1{font-size:27px;}
  .only-mobile{display:flex!important;}
  #tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10.5px;font-weight:600;position:relative;}
  .tab.on{color:var(--accent);}
  .tab .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--p3);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  #fab{
    display:flex;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;
    width:56px;height:56px;border-radius:18px;border:none;background:var(--accent);color:#fff;
    align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(59,91,219,.38);
  }
  #fab svg{width:26px;height:26px;stroke-width:2.4;}
}

/* ---------- quick add ---------- */
.qa{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 6px 6px 14px;box-shadow:var(--shadow);transition:border-color .15s;}
.qa:focus-within{border-color:var(--accent);}
.qa .plus{color:var(--accent);display:flex;}
.qa input{flex:1;min-width:0;border:none;outline:none;background:none;padding:10px 0;font-size:15.5px;}
.qa input::placeholder{color:var(--faint);}
.qa button{border:none;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 14px;}
.qa button:disabled{opacity:.35;cursor:default;}
.qa-prev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;padding:8px 4px 0;}
.qa-hint{font-size:12px;color:var(--faint);}
.qa-hint code{background:var(--surface-2);border-radius:5px;padding:1px 5px;font-size:11.5px;color:var(--dim);font-family:inherit;}
.wrap-qa{margin-bottom:22px;}

/* ---------- chips ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--dim);white-space:nowrap;}
.pill.date{background:var(--accent-soft);color:var(--accent);}
.pill.late{background:var(--red-soft);color:var(--p3);}
.pill.today{background:var(--green-soft);color:var(--green);}
.pill.p3{background:var(--red-soft);color:var(--p3);}
.pill.p2{background:color-mix(in srgb,var(--p2) 14%,transparent);color:var(--p2);}
.pill.p1{background:color-mix(in srgb,var(--p1) 14%,transparent);color:var(--p1);}
.pill.trabajo{background:var(--work-soft);color:var(--work);}
.pill.personal{background:var(--pers-soft);color:var(--pers);}
.pill button{border:none;background:none;padding:0;margin-left:2px;display:flex;color:inherit;opacity:.7;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--dim);font-size:13px;font-weight:600;border-radius:999px;padding:7px 13px;}
.chip:hover{border-color:var(--faint);color:var(--text);}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg);}

/* ---------- sections & rows ---------- */
.sec{margin-bottom:26px;}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;}
.sec-h h2{margin:0;font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px;}
.sec-h h2 .c{color:var(--faint);font-weight:600;}
.sec-h h2.late{color:var(--p3);}
.link{border:none;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 6px;border-radius:6px;}
.link:hover{background:var(--accent-soft);}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}

.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line);transition:opacity .35s, background .15s;}
.row:first-child{border-top:none;}
.row:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface));}
.row .body{flex:1;min-width:0;cursor:pointer;}
.row .t{font-size:15px;font-weight:500;line-height:1.35;word-wrap:break-word;}
.row .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.row .m:empty{display:none;}
.row.done .t{color:var(--faint);text-decoration:line-through;}
.row.leaving{opacity:0;}

.chk{
  width:22px;height:22px;flex:0 0 22px;margin-top:1px;border-radius:50%;
  border:2px solid var(--faint);background:none;padding:0;display:flex;align-items:center;justify-content:center;color:transparent;
  transition:transform .15s, background .2s, border-color .2s;
}
.chk svg{width:12px;height:12px;stroke-width:3.2;}
.chk:hover{color:var(--faint);}
.chk.p3{border-color:var(--p3);background:color-mix(in srgb,var(--p3) 10%,transparent);}
.chk.p2{border-color:var(--p2);background:color-mix(in srgb,var(--p2) 10%,transparent);}
.chk.p1{border-color:var(--p1);background:color-mix(in srgb,var(--p1) 10%,transparent);}
.chk.p3:hover{color:var(--p3);} .chk.p2:hover{color:var(--p2);} .chk.p1:hover{color:var(--p1);}
.chk.on{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;}
.chk.pop{animation:pop .35s ease;}
.chk.rt{border-radius:7px;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.28);}100%{transform:scale(1);}}

.empty{padding:28px 18px;text-align:center;color:var(--faint);font-size:14px;}
.empty .big{font-size:30px;margin-bottom:6px;}
.empty b{display:block;color:var(--dim);font-size:15px;margin-bottom:2px;}

.day-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px;}
.day-h b{font-size:15px;font-weight:700;}
.day-h span{font-size:13px;color:var(--faint);}
.day-h .link{margin-left:auto;}
.day-empty{padding:11px 14px;color:var(--faint);font-size:13.5px;}

/* ---------- hero (hoy) ---------- */
.hero{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;}
.ring{position:relative;width:58px;height:58px;flex:0 0 58px;}
.ring svg{width:58px;height:58px;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:6;}
.ring .bg{stroke:var(--surface-2);}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.hero .h1{font-size:16px;font-weight:700;}
.hero .h2{font-size:13.5px;color:var(--dim);margin-top:2px;}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px;color:var(--faint);}
.search:focus-within{border-color:var(--accent);}
.search input{flex:1;border:none;outline:none;background:none;padding:11px 0;}
.filters{margin-bottom:20px;}

.streak{font-size:12px;font-weight:700;color:var(--p2);}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{border-color:var(--faint);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{opacity:.92;}
.btn.danger{color:var(--p3);}
.btn.danger:hover{border-color:var(--p3);}
.btn.full{width:100%;justify-content:center;}

/* ---------- sheet (modal) ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(12,13,18,.42);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease;}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px;box-shadow:var(--shadow-lg);animation:up .2s ease;}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0;}
  .sheet{border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom);}
}
@keyframes fade{from{opacity:0;}}
@keyframes up{from{transform:translateY(24px);opacity:0;}}
.sh-top{display:flex;align-items:center;gap:10px;padding:18px 18px 6px;}
.sh-top input.title{flex:1;border:none;outline:none;background:none;font-size:20px;font-weight:700;padding:4px 0;}
.sh-top h3{flex:1;margin:0;font-size:18px;font-weight:700;}
.sh-body{padding:6px 18px 8px;}
.fld{margin:16px 0;}
.fld > label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld textarea{
  width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none;
}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);}
.fld textarea{min-height:80px;resize:vertical;line-height:1.5;}
.two{display:flex;gap:10px;}
.two > *{flex:1;min-width:0;}
.sh-foot{display:flex;align-items:center;gap:8px;padding:14px 18px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);}
.sh-foot .sp{flex:1;}

.subs{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.sub{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);}
.sub:first-child{border-top:none;}
.sub .chk{width:18px;height:18px;flex-basis:18px;margin:0;}
.sub span{flex:1;font-size:14px;}
.sub.d span{text-decoration:line-through;color:var(--faint);}
.sub .x{border:none;background:none;color:var(--faint);display:flex;padding:2px;}
.sub .x:hover{color:var(--p3);}
.sub input{flex:1;border:none;outline:none;background:none;padding:2px 0;font-size:14px;}

.days{display:flex;gap:6px;}
.dchip{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--dim);}
.dchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
.switch:first-child{border-top:none;}
.switch .lbl{font-size:14.5px;font-weight:500;}
.switch .lbl small{display:block;color:var(--faint);font-size:12.5px;font-weight:400;margin-top:2px;}
.tg{width:44px;height:26px;border-radius:13px;border:none;background:var(--line);position:relative;flex:0 0 44px;transition:background .2s;}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s;}
.tg.on{background:var(--green);}
.tg.on::after{left:21px;}

.note{font-size:12.5px;color:var(--dim);background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.5;}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
@media (max-width:860px){#toasts{bottom:calc(150px + env(safe-area-inset-bottom));}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:#1D2026;color:#F2F3F5;border-radius:12px;padding:11px 14px 11px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .18s ease;max-width:92vw;}
.toast button{border:none;background:none;color:#9DB2FF;font-weight:700;font-size:13.5px;padding:2px 4px;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"><div id="page"></div></main>
</div>
<nav id="tabbar"></nav>
<button id="fab" aria-label="Agregar"></button>
<div id="toasts"></div>

<script>
/* =========================================================
   MIDPLANER v2
   - Sin inicio de sesión: los datos viven en este navegador (localStorage).
   - Vistas: Hoy · Próximos · Todas · Rutinas · Hechas
   - Captura rápida con lenguaje natural en español.
   ========================================================= */

/* ---------------- almacenamiento ---------------- */
const LS_DATA = "midplaner_v2";
const LS_THEME = "midplaner_theme";
const LS_NOTIF = "midplaner_notif";

let db = loadDb();
function loadDb(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_DATA));
    if(d && Array.isArray(d.tasks)) return {tasks:d.tasks, routines:Array.isArray(d.routines)?d.routines:[]};
  }catch(e){}
  return {tasks:[], routines:[]};
}
function save(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify(db)); }
  catch(e){ toast("No se pudo guardar en este navegador"); }
}
// Si tienes MIDPLANER abierto en dos pestañas, se mantienen iguales.
window.addEventListener("storage", e=>{ if(e.key===LS_DATA){ db = loadDb(); render(); } });

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
const pad = n => String(n).padStart(2,"0");
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
const DOW_FULL = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DOW_SHORT = ["D","L","M","M","J","V","S"];

function dayLabel(s){
  if(!s) return "";
  const n = diffDays(today(), s);
  if(n===0) return "Hoy";
  if(n===1) return "Mañana";
  if(n===-1) return "Ayer";
  const d = parseD(s);
  if(n>1 && n<7) return cap(DOW_FULL[d.getDay()]);
  const opts = {weekday:"short", day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("es-MX", opts).replace(/\./g,"");
}
function longDate(s){ return parseD(s).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtTime(t){
  if(!t) return "";
  let [h,m] = t.split(":").map(Number);
  const ap = h>=12 ? "pm" : "am";
  h = h%12 || 12;
  return h + (m ? ":"+pad(m) : "") + " " + ap;
}
function greeting(){ const h=new Date().getHours(); return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"; }

/* ---------------- íconos ---------------- */
const ICONS = {

/* ---------------- tareas ---------------- */
const PRIO = {3:"Alta",2:"Media",1:"Baja",0:"Ninguna"};
function newTask(o){
  const t = {id:uid(), title:"", notes:"", date:null, time:null, priority:0, cat:null, subtasks:[], done:false, doneAt:null, createdAt:new Date().toISOString(), ...o};
  db.tasks.push(t); save(); return t;
}
const getTask = id => db.tasks.find(t=>t.id===id);
function sortTasks(a,b){
  return (a.date||"9999").localeCompare(b.date||"9999")
      || (a.time||"99").localeCompare(b.time||"99")
      || (b.priority||0)-(a.priority||0)
      || a.createdAt.localeCompare(b.createdAt);
}
const pending = () => db.tasks.filter(t=>!t.done);
const overdue = () => pending().filter(t=>t.date && t.date<today()).sort(sortTasks);
const dueOn = d => pending().filter(t=>t.date===d).sort(sortTasks);

/* ---------------- rutinas ---------------- */
const FREQ = {diaria:"Todos los días", lunvie:"Lunes a viernes", dias:"Días específicos", mensual:"Cada mes"};
function routineOn(r, d){
  if(r.active===false) return false;
  if(r.start && d < r.start) return false;
  const dow = parseD(d).getDay();
  switch(r.freq){
    case "diaria": return true;
    case "lunvie": return dow>=1 && dow<=5;
    case "dias": return (r.days||[]).includes(dow);
    case "mensual": return parseD(d).getDate() === parseD(r.start||d).getDate();
  }
  return false;
}
const routinesOn = d => db.routines.filter(r=>routineOn(r,d)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
function routineDone(r,d){ return !!(r.log && r.log[d]); }
function streak(r){
  let d = today(), n = 0, guard = 0;
  if(routineOn(r,d) && !routineDone(r,d)) d = addDays(d,-1);
  while(guard++ < 800){
    if(r.start && d < r.start) break;
    if(routineOn(r,d)){ if(routineDone(r,d)) n++; else break; }
    d = addDays(d,-1);
  }
  return n;
}
function freqText(r){
  if(r.freq==="dias") return (r.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>DOW_FULL[i].slice(0,3)).join(", ") || "Sin días";
  return FREQ[r.freq]||"";
}

/* =========================================================
   CAPTURA RÁPIDA — lenguaje natural en español
   Ejemplos: "Llamar a Luis mañana a las 10 !alta #trabajo"
             "Pagar tarjeta el viernes 5pm"   "Junta 28/11 16:30"
   ========================================================= */
const DOWMAP = {domingo:0,lunes:1,martes:2,"miércoles":3,miercoles:3,jueves:4,viernes:5,"sábado":6,sabado:6};
function parseQuick(text){
  let s = " " + text + " ";
  const out = {date:undefined, time:null, priority:0, cat:null};
  const cut = (re, fn) => { const m = s.match(re); if(m){ fn(m); s = s.replace(m[0]," "); return true; } return false; };

  cut(/\s#(trabajo|personal|t|p)(?=\s)/i, m=>{ out.cat = m[1][0].toLowerCase()==="t" ? "trabajo" : "personal"; });
  cut(/\s!(alta|media|baja|1|2|3)(?=\s)/i, m=>{ out.priority = {alta:3,"1":3,media:2,"2":2,baja:1,"3":1}[m[1].toLowerCase()]; })
    || cut(/\s(!{1,3})(?=\s)/, m=>{ out.priority = m[1].length; });

  const setTime = (h,mi,ap,assumePm) => {
    h = +h; mi = +(mi||0);
    ap = (ap||"").toLowerCase();
    if(ap==="pm" && h<12) h += 12;
    if(ap==="am" && h===12) h = 0;
    if(!ap && assumePm && h>=1 && h<=6) h += 12;
    if(h<24 && mi<60) out.time = pad(h)+":"+pad(mi);
  };
  cut(/\sa\s+las?\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm|hrs|h)?(?=\s)/i, m=>setTime(m[1],m[2],m[3],true))
    || cut(/\s(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=\s)/i, m=>setTime(m[1],m[2],m[3]))
    || cut(/\s(\d{1,2}):(\d{2})\s*(hrs|h)?(?=\s)/i, m=>setTime(m[1],m[2]));

  const t0 = today();
  cut(/\spasado\s+mañana(?=\s)/i, ()=>{ out.date = addDays(t0,2); })
    || cut(/\smañana(?=\s)/i, ()=>{ out.date = addDays(t0,1); })
    || cut(/\shoy(?=\s)/i, ()=>{ out.date = t0; })
    || cut(/\s(?:la\s+)?pr[oó]xima\s+semana(?=\s)/i, ()=>{ const dw=parseD(t0).getDay(); out.date = addDays(t0, ((8-dw)%7)||7); })
    || cut(/\sen\s+(\d{1,3})\s+d[ií]as?(?=\s)/i, m=>{ out.date = addDays(t0, +m[1]); })
    || cut(/\s(?:sin\s+fecha|algún\s+día|algun\s+dia)(?=\s)/i, ()=>{ out.date = null; })
    || cut(/\s(?:el\s+|este\s+|pr[oó]ximo\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)(?=\s)/i, m=>{
         const target = DOWMAP[m[1].toLowerCase()];
         const dw = parseD(t0).getDay();
         out.date = addDays(t0, ((target-dw+7)%7)||7);
       })
    || cut(/\s(?:el\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, m=>{
         const now = new Date();
         let y = m[3] ? +m[3] : now.getFullYear(); if(y<100) y += 2000;
         const d = new Date(y, +m[2]-1, +m[1]);
         if(d.getMonth() !== +m[2]-1) return;
         let r = iso(d);
         if(!m[3] && r < t0){ d.setFullYear(y+1); r = iso(d); }
         out.date = r;
       });

  out.title = s.replace(/\s+/g," ").trim();
  return out;
}

  return {
    hoy: dueOn(today()).length + overdue().length,
    late: overdue().length,

    todas: pending().length,
    rutinas: routinesOn(today()).filter(r=>!routineDone(r,today())).length,
    hechas: 0,
  };
}

    <div><h1>${title}</h1>${sub?`<div class="subtitle">${sub}</div>`:""}</div>
    <div class="head-btns">
      <button class="icon-btn" data-act="go-search" title="Buscar">${ic("search")}</button>
      <button class="icon-btn only-mobile" data-act="settings" title="Ajustes">${ic("gear")}</button>
    </div>
  </div>`;
}

function quickAddHtml(){
  return `<div class="wrap-qa">
    <form class="qa" id="qa" autocomplete="off">
      <span class="plus">${ic("plus")}</span>
      <input id="qa-in" placeholder="Agregar tarea…" enterkeyhint="done">
      <button type="submit" id="qa-btn" disabled>Agregar</button>
    </form>
    <div class="qa-prev" id="qa-prev"></div>
  </div>`;
}
function defaultAddDate(){
  if(ui.addDate) return ui.addDate;
  if(ui.view==="hoy") return today();
  return null;
}
function updatePreview(){
  const inp = $("#qa-in"), box = $("#qa-prev"), btn = $("#qa-btn");
  if(!inp || !box) return;
  const txt = inp.value.trim();
  btn.disabled = !txt;
  const p = parseQuick(inp.value);
  const date = p.date===undefined ? defaultAddDate() : p.date;
  let h = "";
  if(date) h += `<span class="pill ${date===today()?"today":"date"}">${ic("cal","sm")}${dayLabel(date)}${ui.addDate && p.date===undefined ? `<button type="button" data-act="clear-adddate" title="Quitar">${ic("x","sm")}</button>`:""}</span>`;
  if(p.time) h += `<span class="pill">${ic("clock","sm")}${fmtTime(p.time)}</span>`;
  if(p.priority) h += `<span class="pill p${p.priority}">Prioridad ${PRIO[p.priority].toLowerCase()}</span>`;
  if(p.cat) h += `<span class="pill ${p.cat}">${cap(p.cat)}</span>`;
  if(!txt) h += `<span class="qa-hint">Escribe natural: <code>mañana</code> <code>viernes</code> <code>28/11</code> <code>a las 10</code> <code>5pm</code> <code>!alta</code> <code>#trabajo</code></span>`;
  box.innerHTML = h;
}
function submitQuick(){
  const inp = $("#qa-in");
  const p = parseQuick(inp.value);
  if(!p.title){ toast("Escribe el nombre de la tarea"); return; }
  const date = p.date===undefined ? defaultAddDate() : p.date;
  const t = newTask({title:p.title, date, time:p.time, priority:p.priority, cat:p.cat});
  inp.value = "";
  render();
  const again = $("#qa-in"); if(again) again.focus();
  toast(`Agregada · ${t.date ? dayLabel(t.date) : "Sin fecha"}${t.time?" "+fmtTime(t.time):""}`);
}

/* ---------------- filas ---------------- */
function taskRow(t, {showDate=true}={}){
  const late = !t.done && t.date && t.date < today();
  const subsDone = (t.subtasks||[]).filter(s=>s.done).length;
  let meta = "";
  if(showDate && t.date) meta += `<span class="pill ${late?"late":t.date===today()?"today":""}">${ic("cal","sm")}${dayLabel(t.date)}</span>`;
  if(t.time) meta += `<span class="pill ${late?"late":""}">${ic("clock","sm")}${fmtTime(t.time)}</span>`;
  if(t.cat) meta += `<span class="pill ${t.cat}">${cap(t.cat)}</span>`;
  if(t.subtasks && t.subtasks.length) meta += `<span class="pill">${ic("sub","sm")}${subsDone}/${t.subtasks.length}</span>`;
  if(t.notes) meta += `<span class="pill">${ic("notes","sm")}</span>`;
  return `<div class="row ${t.done?"done":""}" data-id="${t.id}">
    <button class="chk ${t.done?"on":"p"+(t.priority||0)}" data-act="toggle" data-id="${t.id}" aria-label="Completar">${ic("check")}</button>
    <div class="body" data-act="open" data-id="${t.id}">
      <div class="t">${esc(t.title)}</div>
      <div class="m">${meta}</div>
    </div>
  </div>`;
}
function routineRow(r, d, {showFreq=false}={}){
  const done = routineDone(r,d);
  const st = streak(r);
  let meta = "";
  if(r.time) meta += `<span class="pill">${ic("clock","sm")}${fmtTime(r.time)}</span>`;
  meta += `<span class="pill">${ic("repeat","sm")}${showFreq?freqText(r):"Rutina"}</span>`;
  if(r.cat) meta += `<span class="pill ${r.cat}">${cap(r.cat)}</span>`;
  if(r.notify) meta += `<span class="pill">${ic("bell","sm")}</span>`;
  if(r.active===false) meta += `<span class="pill">Pausada</span>`;
  if(st>=2) meta += `<span class="streak">🔥 ${st} seguidas</span>`;
  const showChk = routineOn(r,d);
  return `<div class="row ${done?"done":""}">
    ${showChk ? `<button class="chk rt ${done?"on":""}" data-act="toggle-rt" data-id="${r.id}" aria-label="Hecha">${ic("check")}</button>` : `<span style="width:22px;flex:0 0 22px"></span>`}
    <div class="body" data-act="open-rt" data-id="${r.id}">
      <div class="t">${esc(r.name)}</div>
      <div class="m">${meta}</div>
    </div>
  </div>`;
}
function section(title, count, inner, {action="", late=false}={}){
  return `<section class="sec">
    <div class="sec-h"><h2 class="${late?"late":""}">${title}${count!=null?` <span class="c">${count}</span>`:""}</h2>${action}</div>
    <div class="group">${inner}</div>
  </section>`;
}
function emptyHtml(emoji, title, text){
  return `<div class="empty"><div class="big">${emoji}</div><b>${title}</b>${text||""}</div>`;
}

/* ---------------- vistas ---------------- */
function renderPage(){
  const page = $("#page");
  const map = {hoy:viewHoy, proximos:viewProximos, todas:viewTodas, rutinas:viewRutinas, hechas:viewHechas};
  const keepQa = $("#qa-in") ? $("#qa-in").value : "";
  page.innerHTML = (map[ui.view]||viewHoy)();
  const qa = $("#qa");
  if(qa){
    const inp = $("#qa-in");
    inp.value = keepQa;
    inp.placeholder = ui.view==="hoy" ? "Agregar tarea para hoy…" : "Agregar tarea…";
    inp.addEventListener("input", updatePreview);
    qa.addEventListener("submit", e=>{ e.preventDefault(); submitQuick(); });
    updatePreview();
  }
  const sq = $("#search-in");
  if(sq){
    sq.addEventListener("input", ()=>{ ui.q = sq.value; const l=$("#todas-list"); if(l) l.innerHTML = todasListHtml(); });
  }
}

function viewHoy(){
  const t = today();
  const late = overdue();
  const tasks = dueOn(t);
  const rts = routinesOn(t);
  const doneToday = db.tasks.filter(x=>x.done && x.doneAt && x.doneAt.slice(0,10)===t);
  const doneTodayDue = db.tasks.filter(x=>x.done && x.date===t).length;
  const total = tasks.length + doneTodayDue + rts.length;
  const done = doneTodayDue + rts.filter(r=>routineDone(r,t)).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const C = 2*Math.PI*25;
  let msg;
  if(!total) msg = "Día libre por ahora. Agrega lo que quieras lograr hoy.";
  else if(done===total) msg = "¡Todo listo por hoy! 🎉";
  else msg = `Te faltan ${total-done} de ${total}${late.length?` · ${late.length} vencida${late.length>1?"s":""}`:""}`;

  let h = headHtml(greeting(), cap(longDate(t)));
  h += `<div class="hero">
    <div class="ring"><svg viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="25"/><circle class="fg" cx="29" cy="29" r="25" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="pct">${pct}%</div></div>
    <div><div class="h1">${total ? `${done} de ${total} hechas` : "Sin pendientes"}</div><div class="h2">${msg}</div></div>
  </div>`;
  h += quickAddHtml();
  if(late.length) h += section("Vencidas", late.length, late.map(x=>taskRow(x)).join(""), {late:true, action:`<button class="link" data-act="move-late">Pasar todo a hoy</button>`});
  if(rts.length) h += section("Rutinas", `${rts.filter(r=>routineDone(r,t)).length}/${rts.length}`, rts.map(r=>routineRow(r,t)).join(""));
  h += section("Tareas", tasks.length||null, tasks.length ? tasks.map(x=>taskRow(x,{showDate:false})).join("") : emptyHtml("☀️","Nada pendiente para hoy","Usa la barra de arriba para agregar algo."));
  if(doneToday.length){
    h += `<section class="sec"><div class="sec-h"><h2>Completadas hoy <span class="c">${doneToday.length}</span></h2><button class="link" data-act="toggle-donetoday">${ui.showDoneToday?"Ocultar":"Mostrar"}</button></div>
      ${ui.showDoneToday ? `<div class="group">${doneToday.map(x=>taskRow(x,{showDate:false})).join("")}</div>` : ""}</section>`;
  }
  return h;
}

function viewProximos(){
  const t = today();
  let h = headHtml("Próximos", "Lo que viene en los siguientes días");
  h += quickAddHtml();
  for(let i=1;i<=7;i++){
    const d = addDays(t,i);
    const list = dueOn(d);
    const rtCount = routinesOn(d).length;
    h += `<section class="sec">
      <div class="day-h"><b>${dayLabel(d)}</b><span>${parseD(d).toLocaleDateString("es-MX",{day:"numeric",month:"long"})}${rtCount?` · ${rtCount} rutina${rtCount>1?"s":""}`:""}</span>
        <button class="link" data-act="add-on" data-d="${d}">+ Agregar</button></div>
      <div class="group">${list.length ? list.map(x=>taskRow(x,{showDate:false})).join("") : `<div class="day-empty">Sin tareas</div>`}</div>
    </section>`;
  }
  const later = pending().filter(x=>x.date && x.date>addDays(t,7)).sort(sortTasks);
  if(later.length) h += section("Más adelante", later.length, later.map(x=>taskRow(x)).join(""));
  return h;
}

const FILTERS = [
  {id:"pendientes", label:"Pendientes", fn:t=>!t.done},
  {id:"sinfecha",   label:"Sin fecha",  fn:t=>!t.done && !t.date},
  {id:"alta",       label:"Prioridad alta", fn:t=>!t.done && t.priority===3},
  {id:"trabajo",    label:"Trabajo",    fn:t=>!t.done && t.cat==="trabajo"},
  {id:"personal",   label:"Personal",   fn:t=>!t.done && t.cat==="personal"},
];
function todasListHtml(){
  const f = FILTERS.find(x=>x.id===ui.filter) || FILTERS[0];
  const q = ui.q.trim().toLowerCase();
  let list = db.tasks.filter(t => q ? (t.title+" "+(t.notes||"")).toLowerCase().includes(q) : f.fn(t));
  list.sort((a,b)=> (a.done-b.done) || sortTasks(a,b));
  if(!list.length) return `<div class="group">${q ? emptyHtml("🔎","Sin resultados","") : emptyHtml("✨","Nada por aquí","")}</div>`;
  return `<div class="group">${list.map(x=>taskRow(x)).join("")}</div>`;
}
function viewTodas(){
  let h = headHtml("Todas", `${pending().length} pendientes`);
  h += quickAddHtml();
  h += `<div class="search">${ic("search")}<input id="search-in" placeholder="Buscar tareas…" value="${esc(ui.q)}"></div>`;
  h += `<div class="chips filters">${FILTERS.map(f=>`<button class="chip ${ui.filter===f.id&&!ui.q?"on":""}" data-act="filter" data-f="${f.id}">${f.label}</button>`).join("")}</div>`;
  h += `<div id="todas-list">${todasListHtml()}</div>`;
  return h;
}

function viewRutinas(){
  const t = today();
  const todayR = routinesOn(t);
  const all = db.routines.slice().sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  let h = headHtml("Rutinas", "Hábitos que se repiten solos");
  h += `<div style="margin-bottom:22px"><button class="btn pri" data-act="new-rt">${ic("plus")}Nueva rutina</button></div>`;
  if(todayR.length) h += section("Hoy", `${todayR.filter(r=>routineDone(r,t)).length}/${todayR.length}`, todayR.map(r=>routineRow(r,t)).join(""));
  h += section("Todas las rutinas", all.length||null, all.length ? all.map(r=>routineRow(r,t,{showFreq:true})).join("") : emptyHtml("🔁","Aún no tienes rutinas","Ej. Revisar ventas de lunes a viernes a las 8:30."));
  return h;
}

function viewHechas(){
  const done = db.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  let h = headHtml("Hechas", `${done.length} completada${done.length===1?"":"s"}`);
  if(!done.length) return h + `<div class="group">${emptyHtml("✅","Aquí verás lo que vas terminando","")}</div>`;
  h += `<div style="margin-bottom:22px"><button class="btn danger" data-act="clear-done">${ic("trash")}Borrar completadas</button></div>`;
  const groups = {};
  done.forEach(t=>{ const k=(t.doneAt||"").slice(0,10)||"—"; (groups[k]=groups[k]||[]).push(t); });
  Object.keys(groups).forEach(k=>{
    h += section(k==="—"?"Sin fecha":dayLabel(k), groups[k].length, groups[k].map(x=>taskRow(x)).join(""));
  });
  return h;
}

/* ---------------- acciones ---------------- */
function toggleTask(id, btn){
  const t = getTask(id); if(!t) return;
  if(t.done){
    t.done = false; t.doneAt = null; save(); render(); return;
  }
  const row = btn && btn.closest(".row");
  if(btn){ btn.classList.add("on","pop"); }
  setTimeout(()=>{ if(row) row.classList.add("leaving"); }, 220);
  setTimeout(()=>{
    t.done = true; t.doneAt = new Date().toISOString(); save(); render();
    toast("Tarea completada", ()=>{ t.done=false; t.doneAt=null; save(); render(); });
  }, 520);
}
function toggleRoutine(id){
  const r = db.routines.find(x=>x.id===id); if(!r) return;
  const d = today();
  r.log = r.log || {};
  if(r.log[d]) delete r.log[d]; else r.log[d] = true;
  save(); render();
  if(r.log[d]){ const s=streak(r); toast(s>=2?`¡${s} veces seguidas! 🔥`:"Rutina hecha"); }
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case "view": go(el.dataset.v); break;
    case "toggle": e.stopPropagation(); toggleTask(id, el); break;
    case "open": openTask(id); break;
    case "toggle-rt": toggleRoutine(id); break;
    case "open-rt": openRoutine(id); break;
    case "new-rt": openRoutine(null); break;
    case "add-on": ui.addDate = el.dataset.d; window.scrollTo({top:0,behavior:"smooth"}); updatePreview(); $("#qa-in").focus(); break;
    case "clear-adddate": ui.addDate = null; updatePreview(); $("#qa-in").focus(); break;
    case "move-late": {
      const late = overdue(); const prev = late.map(t=>[t,t.date]);
      late.forEach(t=>t.date=today()); save(); render();
      toast(`${late.length} tarea${late.length>1?"s":""} movida${late.length>1?"s":""} a hoy`, ()=>{ prev.forEach(([t,d])=>t.date=d); save(); render(); });
      break;
    }
    case "filter": ui.filter = el.dataset.f; ui.q = ""; render(); break;
    case "toggle-donetoday": ui.showDoneToday = !ui.showDoneToday; render(); break;
    case "clear-done": {
      const removed = db.tasks.filter(t=>t.done);
      if(!confirm(`¿Borrar ${removed.length} tareas completadas?`)) return;
      db.tasks = db.tasks.filter(t=>!t.done); save(); render();
      toast("Completadas borradas", ()=>{ db.tasks.push(...removed); save(); render(); });
      break;
    }
    case "settings": openSettings(); break;
    case "go-search": go("todas"); setTimeout(()=>{ const s=$("#search-in"); if(s) s.focus(); }, 30); break;
  }
});
function go(v){
  ui.view = v; ui.addDate = null;
  if(history.replaceState) history.replaceState(null,"","#"+v);
  render(); window.scrollTo(0,0);
}
$("#fab").addEventListener("click", ()=>{
  if(ui.view==="rutinas"){ openRoutine(null); return; }
  if(ui.view==="hechas") go("hoy");
  window.scrollTo({top:0,behavior:"smooth"});
  setTimeout(()=>{ const i=$("#qa-in"); if(i) i.focus(); }, 60);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeSheet();
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||e.metaKey||e.ctrlKey||$(".overlay")) return;
  if(e.key==="n"||e.key==="N"){ const i=$("#qa-in"); if(i){ e.preventDefault(); i.focus(); } }
  if(e.key==="/"){ e.preventDefault(); go("todas"); setTimeout(()=>$("#search-in").focus(),30); }
  const idx = ["1","2","3","4","5"].indexOf(e.key);
  if(idx>-1) go(VIEWS[idx].id);
});

/* ---------------- hoja (modal) ---------------- */
function openSheet(html){
  closeSheet(true);
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  ov.addEventListener("mousedown", e=>{ if(e.target===ov) closeSheet(); });
  document.body.appendChild(ov);
  return ov.querySelector(".sheet");
}
function closeSheet(silent){
  const ov = $(".overlay");
  if(ov){ ov.remove(); if(!silent) render(); }
}

/* ---------- detalle de tarea (guarda solo) ---------- */
function openTask(id){
  const t = getTask(id); if(!t) return;
  const sh = openSheet("");
  const draw = () => {
    const t0 = today();
    const quick = [
      ["Hoy", t0], ["Mañana", addDays(t0,1)],
      ["Sábado", addDays(t0, ((6-parseD(t0).getDay()+7)%7)||7)],
      ["Próx. lunes", addDays(t0, ((1-parseD(t0).getDay()+7)%7)||7)],
      ["Sin fecha", ""],
    ];
    sh.innerHTML = `
      <div class="sh-top">
        <button class="chk ${t.done?"on":"p"+(t.priority||0)}" id="s-done">${ic("check")}</button>
        <input class="title" id="s-title" value="${esc(t.title)}">
        <button class="icon-btn" id="s-close">${ic("x")}</button>
      </div>
      <div class="sh-body">
        <div class="fld"><label>${ic("cal","sm")}Fecha</label>
          <div class="chips" style="margin-bottom:10px">${quick.map(([l,v])=>`<button class="chip ${(t.date||"")===v?"on":""}" data-d="${v}">${l}</button>`).join("")}</div>
          <div class="two"><input type="date" id="s-date" value="${t.date||""}"><input type="time" id="s-time" value="${t.time||""}"></div>
        </div>
        <div class="fld"><label>Prioridad</label>
          <div class="chips">${[3,2,1,0].map(p=>`<button class="chip ${(t.priority||0)===p?"on":""}" data-p="${p}">${p?`<span style="color:var(--p${p})">●</span> `:""}${PRIO[p]}</button>`).join("")}</div>
        </div>
        <div class="fld"><label>Categoría</label>
          <div class="chips">${[["trabajo","Trabajo"],["personal","Personal"],["","Ninguna"]].map(([v,l])=>`<button class="chip ${(t.cat||"")===v?"on":""}" data-c="${v}">${l}</button>`).join("")}</div>
        </div>
        <div class="fld"><label>${ic("sub","sm")}Subtareas</label>
          <div class="subs">
            ${(t.subtasks||[]).map(s=>`<div class="sub ${s.done?"d":""}"><button class="chk ${s.done?"on":""}" data-st="${s.id}">${ic("check")}</button><span>${esc(s.t)}</span><button class="x" data-sx="${s.id}">${ic("x","sm")}</button></div>`).join("")}
            <div class="sub"><span style="color:var(--faint);display:flex">${ic("plus","sm")}</span><input id="s-newsub" placeholder="Agregar paso y Enter"></div>
          </div>
        </div>
        <div class="fld"><label>${ic("notes","sm")}Notas</label><textarea id="s-notes" placeholder="Detalles, teléfonos, links…">${esc(t.notes||"")}</textarea></div>
      </div>
      <div class="sh-foot">
        <button class="btn danger" id="s-del">${ic("trash")}Eliminar</button>
        <span class="sp"></span>
        <button class="btn pri" id="s-ok">Listo</button>
      </div>`;
    const q = s => sh.querySelector(s);
    q("#s-close").onclick = ()=>closeSheet();
    q("#s-ok").onclick = ()=>closeSheet();
    q("#s-title").oninput = e=>{ t.title = e.target.value; save(); };
    q("#s-title").onblur = e=>{ if(!t.title.trim()){ t.title = "Sin título"; save(); } };
    q("#s-notes").oninput = e=>{ t.notes = e.target.value; save(); };
    q("#s-date").onchange = e=>{ t.date = e.target.value || null; save(); draw(); };
    q("#s-time").onchange = e=>{ t.time = e.target.value || null; save(); };
    q("#s-done").onclick = ()=>{ t.done = !t.done; t.doneAt = t.done ? new Date().toISOString() : null; save(); draw(); };
    sh.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ t.date = b.dataset.d || null; if(!t.date) t.time = null; save(); draw(); });
    sh.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ t.priority = +b.dataset.p; save(); draw(); });
    sh.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ t.cat = b.dataset.c || null; save(); draw(); });
    sh.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ const s=t.subtasks.find(x=>x.id===b.dataset.st); s.done=!s.done; save(); draw(); });
    sh.querySelectorAll("[data-sx]").forEach(b=>b.onclick=()=>{ t.subtasks=t.subtasks.filter(x=>x.id!==b.dataset.sx); save(); draw(); });
    q("#s-newsub").onkeydown = e=>{
      if(e.key==="Enter" && e.target.value.trim()){
        e.preventDefault();
        t.subtasks = t.subtasks || [];
        t.subtasks.push({id:uid(), t:e.target.value.trim(), done:false});
        save(); draw(); sh.querySelector("#s-newsub").focus();
      }
    };
    q("#s-del").onclick = ()=>{
      const i = db.tasks.indexOf(t);
      db.tasks.splice(i,1); save(); closeSheet();
      toast("Tarea eliminada", ()=>{ db.tasks.splice(i,0,t); save(); render(); });
    };
  };
  draw();
}

/* ---------- rutina (crear / editar) ---------- */
function openRoutine(id){
  const orig = id ? db.routines.find(r=>r.id===id) : null;
  const r = orig ? JSON.parse(JSON.stringify(orig)) : {id:uid(), name:"", time:"", freq:"lunvie", days:[1,2,3,4,5], cat:"trabajo", notify:false, active:true, start:today(), log:{}};
  const sh = openSheet("");
  const draw = () => {
    sh.innerHTML = `
      <div class="sh-top"><h3>${orig?"Editar rutina":"Nueva rutina"}</h3><button class="icon-btn" id="r-close">${ic("x")}</button></div>
      <div class="sh-body">
        <div class="fld"><label>Nombre</label><input type="text" id="r-name" value="${esc(r.name)}" placeholder="Ej. Revisar ventas del día"></div>
        <div class="fld"><label>Se repite</label>
          <div class="chips">${Object.entries(FREQ).map(([k,l])=>`<button class="chip ${r.freq===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
          ${r.freq==="dias" ? `<div class="days" style="margin-top:12px">${[1,2,3,4,5,6,0].map(i=>`<button class="dchip ${(r.days||[]).includes(i)?"on":""}" data-dw="${i}">${DOW_SHORT[i]}</button>`).join("")}</div>` : ""}
          ${r.freq==="mensual" ? `<div class="note" style="margin-top:10px">Se repite cada mes el día ${parseD(r.start).getDate()} (según la fecha de inicio).</div>` : ""}
        </div>
        <div class="two">
          <div class="fld"><label>Hora</label><input type="time" id="r-time" value="${r.time||""}"></div>
          <div class="fld"><label>Empieza</label><input type="date" id="r-start" value="${r.start||today()}"></div>
        </div>
        <div class="fld"><label>Categoría</label>
          <div class="chips">${[["trabajo","Trabajo"],["personal","Personal"],["","Ninguna"]].map(([v,l])=>`<button class="chip ${(r.cat||"")===v?"on":""}" data-c="${v}">${l}</button>`).join("")}</div>
        </div>
        <div class="fld">
          <div class="switch"><div class="lbl">Recordatorio<small>Aviso a la hora indicada mientras MIDPLANER esté abierto</small></div><button class="tg ${r.notify?"on":""}" id="r-notify"></button></div>
          <div class="switch"><div class="lbl">Activa<small>Pausa la rutina sin borrarla</small></div><button class="tg ${r.active!==false?"on":""}" id="r-active"></button></div>
        </div>
      </div>
      <div class="sh-foot">
        ${orig?`<button class="btn danger" id="r-del">${ic("trash")}Eliminar</button>`:""}
        <span class="sp"></span>
        <button class="btn" id="r-cancel">Cancelar</button>
        <button class="btn pri" id="r-save">Guardar</button>
      </div>`;
    const q = s => sh.querySelector(s);
    q("#r-name").oninput = e=>{ r.name = e.target.value; };
    q("#r-time").onchange = e=>{ r.time = e.target.value; };
    q("#r-start").onchange = e=>{ r.start = e.target.value || today(); if(r.freq==="mensual") draw(); };
    sh.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ r.freq=b.dataset.f; draw(); });
    sh.querySelectorAll("[data-dw]").forEach(b=>b.onclick=()=>{ const d=+b.dataset.dw; r.days = r.days||[]; r.days = r.days.includes(d) ? r.days.filter(x=>x!==d) : [...r.days,d]; draw(); });
    sh.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ r.cat=b.dataset.c||null; draw(); });
    q("#r-notify").onclick = ()=>{ r.notify=!r.notify; if(r.notify) askNotif(); draw(); };
    q("#r-active").onclick = ()=>{ r.active = r.active===false; draw(); };
    q("#r-close").onclick = ()=>closeSheet();
    q("#r-cancel").onclick = ()=>closeSheet();
    q("#r-save").onclick = ()=>{
      if(!r.name.trim()){ toast("Ponle nombre a la rutina"); q("#r-name").focus(); return; }
      if(r.freq==="dias" && !(r.days||[]).length){ toast("Elige al menos un día"); return; }
      r.name = r.name.trim(); r.time = r.time || null;
      if(orig) Object.assign(orig, r); else db.routines.push(r);
      save(); closeSheet(); toast(orig?"Rutina actualizada":"Rutina creada");
    };
    if(orig) q("#r-del").onclick = ()=>{
      if(!confirm("¿Eliminar esta rutina y su historial?")) return;
      const i = db.routines.indexOf(orig);
      db.routines.splice(i,1); save(); closeSheet();
      toast("Rutina eliminada", ()=>{ db.routines.splice(i,0,orig); save(); render(); });
    };
    if(!orig && !r.name) setTimeout(()=>q("#r-name") && q("#r-name").focus(), 50);
  };
  draw();
}

/* ---------- ajustes ---------- */
function openSettings(){
  const sh = openSheet("");
  const draw = () => {
    const theme = localStorage.getItem(LS_THEME) || "system";
    const notif = localStorage.getItem(LS_NOTIF)==="1";
    sh.innerHTML = `
      <div class="sh-top"><h3>Ajustes</h3><button class="icon-btn" id="g-close">${ic("x")}</button></div>
      <div class="sh-body">
        <div class="fld"><label>Apariencia</label>
          <div class="chips">${[["system","Automático"],["light","Claro"],["dark","Oscuro"]].map(([v,l])=>`<button class="chip ${theme===v?"on":""}" data-th="${v}">${l}</button>`).join("")}</div>
        </div>
        <div class="fld"><label>Recordatorios</label>
          <div class="switch"><div class="lbl">Avisos del navegador<small>Para tareas con hora y rutinas con recordatorio. Solo funcionan con MIDPLANER abierto.</small></div><button class="tg ${notif?"on":""}" id="g-notif"></button></div>
        </div>
        <div class="fld"><label>Respaldo</label>
          <div class="note" style="margin-bottom:10px">Tus tareas se guardan en este navegador y en este dispositivo. Descarga un respaldo de vez en cuando; también te sirve para pasarlas a otra computadora o al celular.</div>
          <div class="two">
            <button class="btn full" id="g-export">Descargar respaldo</button>
            <button class="btn full" id="g-import">Cargar respaldo</button>
          </div>
          <input type="file" id="g-file" accept="application/json,.json" style="display:none">
        </div>
        <div class="fld"><label>Atajos de teclado</label>
          <div class="note"><b>N</b> nueva tarea · <b>/</b> buscar · <b>1–5</b> cambiar de vista · <b>Esc</b> cerrar</div>
        </div>
        <div class="fld"><label>Zona de cuidado</label>
          <button class="btn danger full" id="g-wipe">${ic("trash")}Borrar todos los datos</button>
        </div>
        <div style="text-align:center;color:var(--faint);font-size:12px;margin:18px 0 6px">MIDPLANER · ${db.tasks.length} tareas · ${db.routines.length} rutinas</div>
      </div>`;
    const q = s => sh.querySelector(s);
    q("#g-close").onclick = ()=>closeSheet();
    sh.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ localStorage.setItem(LS_THEME,b.dataset.th); applyTheme(); draw(); });
    q("#g-notif").onclick = async ()=>{
      if(localStorage.getItem(LS_NOTIF)==="1"){ localStorage.setItem(LS_NOTIF,"0"); draw(); return; }
      const ok = await askNotif(); if(ok) toast("Avisos activados"); draw();
    };
    q("#g-export").onclick = ()=>{
      const blob = new Blob([JSON.stringify({app:"midplaner",version:2,exportedAt:new Date().toISOString(),...db},null,2)],{type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `midplaner-respaldo-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    };
    q("#g-import").onclick = ()=>q("#g-file").click();
    q("#g-file").onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{
        try{
          const d = JSON.parse(rd.result);
          if(!Array.isArray(d.tasks)) throw new Error();
          if(!confirm(`Este respaldo tiene ${d.tasks.length} tareas y ${(d.routines||[]).length} rutinas. Reemplazará lo que tienes ahora. ¿Continuar?`)) return;
          db = {tasks:d.tasks, routines:Array.isArray(d.routines)?d.routines:[]};
          save(); closeSheet(); toast("Respaldo cargado");
        }catch(err){ toast("Ese archivo no es un respaldo de MIDPLANER"); }
      };
      rd.readAsText(f);
    };
    q("#g-wipe").onclick = ()=>{
      if(!confirm("Se borrarán todas tus tareas y rutinas de este navegador. ¿Seguro?")) return;
      db = {tasks:[], routines:[]}; save(); closeSheet(); toast("Datos borrados");
    };
  };
  draw();
}

function applyTheme(){
  const t = localStorage.getItem(LS_THEME) || "system";
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* ---------------- toasts ---------------- */
function toast(msg, undo){
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${undo?`<button>Deshacer</button>`:""}`;
  if(undo) el.querySelector("button").onclick = ()=>{ undo(); el.remove(); };
  wrap.appendChild(el);
  while(wrap.children.length>2) wrap.firstChild.remove();
  setTimeout(()=>{ el.style.transition="opacity .25s"; el.style.opacity="0"; setTimeout(()=>el.remove(),260); }, undo?5000:2600);
}

/* ---------------- recordatorios ---------------- */
async function askNotif(){
  if(!("Notification" in window)){ toast("Este navegador no permite avisos"); return false; }
  let p = Notification.permission;
  if(p!=="granted") p = await Notification.requestPermission();
  if(p==="granted"){ localStorage.setItem(LS_NOTIF,"1"); return true; }
  toast("No se dio permiso para los avisos"); return false;
}
const fired = new Set();
function notify(title, body){
  toast(`🔔 ${title}`);
  if(localStorage.getItem(LS_NOTIF)!=="1" || !("Notification" in window) || Notification.permission!=="granted") return;
  try{ new Notification(title, {body}); }
  catch(e){
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body})).catch(()=>{});
    }
  }
}
function checkReminders(){
  const d = today(), now = nowHM();
  dueOn(d).forEach(t=>{
    if(t.time===now && !fired.has(t.id+d+now)){ fired.add(t.id+d+now); notify(t.title, "Tarea de MIDPLANER"); }
  });
  routinesOn(d).forEach(r=>{
    if(r.notify && r.time===now && !routineDone(r,d) && !fired.has(r.id+d)){ fired.add(r.id+d); notify(r.name, "Es momento de tu rutina"); }
  });
}
setInterval(checkReminders, 20000);

/* refresca al cambiar de día o al volver a la pestaña */
let lastDay = today();
setInterval(()=>{ if(today()!==lastDay){ lastDay=today(); if(!$(".overlay")) render(); } }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !$(".overlay") && !document.activeElement.matches("input,textarea")) render(); });

/* ---------------- arranque ---------------- */
applyTheme();
render();
checkReminders();
</script>
