<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDPLANER</title>
<meta name="theme-color" content="#3B5BDB">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%233B5BDB%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" onload="window.dispatchEvent(new Event('supabase-ready'))"></script>
<style>
/* ======================================================
   MIDPLANER — ESTILOS
   ====================================================== */
:root{
  --font: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

  --bg: #FAFAF9;
  --bg-elev: #FFFFFF;
  --bg-sunken: #F1F1EF;
  --border: #E6E4E0;
  --text: #1B1D22;
  --text-dim: #6B6F76;
  --text-faint: #9498A0;

  --accent: #3B5BDB;
  --accent-dim: #EEF1FD;
  --accent-text: #FFFFFF;

  --ok: #1B8A5A;
  --ok-bg: #E7F6EE;
  --warn: #B5750B;
  --warn-bg: #FBF0DD;
  --danger: #C23B3B;
  --danger-bg: #FBEAEA;
  --info: #6741D9;
  --info-bg: #F0EBFC;

  --prio-alta: #C23B3B;
  --prio-media: #B5750B;
  --prio-baja: #1B8A5A;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 6px 20px rgba(20,20,30,.06);
}
:root[data-theme="dark"]{
  --bg: #15171B;
  --bg-elev: #1C1F24;
  --bg-sunken: #101215;
  --border: #2B2F36;
  --text: #EDEEF0;
  --text-dim: #A2A6AD;
  --text-faint: #6B6F76;
  --accent: #6E8CFA;
  --accent-dim: #232A47;
  --accent-text: #0D1020;
  --ok-bg: #113023;
  --warn-bg: #332609;
  --danger-bg: #391414;
  --info-bg: #241a3d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg: #15171B; --bg-elev:#1C1F24; --bg-sunken:#101215; --border:#2B2F36;
    --text:#EDEEF0; --text-dim:#A2A6AD; --text-faint:#6B6F76;
    --accent:#6E8CFA; --accent-dim:#232A47; --accent-text:#0D1020;
    --ok-bg:#113023; --warn-bg:#332609; --danger-bg:#391414; --info-bg:#241a3d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;}
a{color:var(--accent);text-decoration:none;}
::selection{background:var(--accent-dim);}

/* ---------- layout shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex:0 0 230px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 12px;gap:2px;position:sticky;top:0;height:100vh;
}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
#sidebar .brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto;}
#sidebar .brand .name{font-weight:800;font-size:17px;letter-spacing:.2px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--text-dim);cursor:pointer;font-size:14.5px;font-weight:500;user-select:none;position:relative;
}
.nav-item:hover{background:var(--bg-sunken);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600;}
.nav-item .ic{width:20px;text-align:center;font-size:16px;}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:20px;padding:1px 6px;font-weight:700;}
#sidebar .foot{margin-top:auto;padding:10px 12px;border-top:1px solid var(--border);}
#sidebar .sync-pill{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);padding:6px 0;}
#sidebar .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
#sidebar .user-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--text-dim);}
#sidebar .user-row button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px;}
#sidebar .user-row button:hover{color:var(--danger);}

#main{flex:1;min-width:0;padding:26px 34px 90px;max-width:980px;}
#main.wide{max-width:none;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px;}
.topbar h1{font-size:22px;margin:0;font-weight:700;}
.topbar .sub{color:var(--text-dim);font-size:13.5px;margin-top:2px;}
.top-actions{display:flex;gap:8px;align-items:center;}

/* mobile bottom nav */
#bottomnav{display:none;}
#fab{
  display:none;position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--accent-text);border:none;font-size:26px;box-shadow:var(--shadow);
  z-index:40;cursor:pointer;align-items:center;justify-content:center;
}
#fab-desktop{display:flex;}

@media (max-width: 900px){
  #sidebar{display:none;}
  #main{padding:16px 14px 90px;max-width:100%;}
  #bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--bg-elev);
    border-top:1px solid var(--border);z-index:30;padding-bottom:env(safe-area-inset-bottom);
  }
  #bottomnav .bn-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--text-faint);font-size:10.5px;cursor:pointer;position:relative;
  }
  #bottomnav .bn-item.active{color:var(--accent);}
  #bottomnav .bn-item .ic{font-size:19px;}
  #fab{display:flex;}
  #fab-desktop{display:none;}
}

/* ---------- generic ui ---------- */
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.section{margin-bottom:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-head h2{font-size:14.5px;margin:0;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;}
.section-head h2 .cnt{color:var(--text-faint);font-weight:500;margin-left:4px;text-transform:none;letter-spacing:0;}
.list{display:flex;flex-direction:column;gap:8px;}
.empty{color:var(--text-faint);font-size:13.5px;padding:18px 4px;text-align:center;background:var(--bg-sunken);border-radius:var(--radius);}

.item-row{
  display:flex;align-items:flex-start;gap:10px;background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 12px;cursor:pointer;transition:border-color .12s;
}
.item-row:hover{border-color:var(--accent);}
.item-row .check{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;margin-top:1px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
}
.item-row .check:hover{border-color:var(--accent);}
.item-row .check.done{background:var(--ok);border-color:var(--ok);color:#fff;}
.item-row .body{flex:1;min-width:0;}
.item-row .title{font-size:14.5px;font-weight:600;line-height:1.35;}
.item-row .title.done{text-decoration:line-through;color:var(--text-faint);font-weight:500;}
.item-row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.tag.prio-alta{background:var(--danger-bg);color:var(--prio-alta);}
.tag.prio-media{background:var(--warn-bg);color:var(--prio-media);}
.tag.prio-baja{background:var(--ok-bg);color:var(--prio-baja);}
.tag.cat-trabajo{background:var(--info-bg);color:var(--info);}
.tag.cat-personal{background:var(--accent-dim);color:var(--accent);}
.tag.muted{background:var(--bg-sunken);color:var(--text-dim);}
.tag.overdue{background:var(--danger-bg);color:var(--danger);}
.item-row .chev{color:var(--text-faint);font-size:13px;margin-top:2px;}

.btn{
  border:1px solid var(--border);background:var(--bg-elev);color:var(--text);border-radius:var(--radius-sm);
  padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.btn.primary:hover{opacity:.92;color:var(--accent-text);}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);}
.btn.ghost{background:none;border:none;}
.btn.sm{padding:5px 10px;font-size:12.5px;}
.btn.icon{padding:8px;}
.btn[disabled]{opacity:.5;cursor:default;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text);outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:7px 13px;border-radius:20px;border:1px solid var(--border);font-size:12.5px;font-weight:600;
  cursor:pointer;color:var(--text-dim);background:var(--bg-elev);
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.days-picker{display:flex;gap:5px;}
.day-chip{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-dim);}
.day-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}

/* modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(10,10,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(1px);}
@media(min-width:640px){.overlay{align-items:center;}}
.sheet{
  background:var(--bg-elev);width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);
}
@media(min-width:640px){.sheet{border-radius:16px;margin:20px;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{margin:0;font-size:17px;font-weight:700;}
.sheet-head .x{cursor:pointer;color:var(--text-faint);font-size:20px;padding:2px 6px;}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--border);padding-top:14px;}

.quick-opts{display:flex;flex-direction:column;gap:6px;}
.quick-opt{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;font-weight:600;}
.quick-opt:hover{background:var(--bg-sunken);}
.quick-opt .ic{width:26px;text-align:center;font-size:18px;}

/* toast */
#toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;}
@media(max-width:900px){#toast-wrap{top:auto;bottom:80px;right:12px;left:12px;max-width:none;}}
.toast{background:var(--bg-elev);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:tin .15s ease;}
.toast.ok{border-left:3px solid var(--ok);}
.toast.err{border-left:3px solid var(--danger);}
.toast.info{border-left:3px solid var(--info);}
@keyframes tin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

/* login */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.auth-box{width:100%;max-width:380px;}
.auth-box .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
.auth-box .brand .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;}
.auth-box .brand .name{font-weight:800;font-size:21px;}
.auth-tabs{display:flex;gap:4px;background:var(--bg-sunken);border-radius:var(--radius-sm);padding:3px;margin-bottom:18px;}
.auth-tabs button{flex:1;border:none;background:none;padding:9px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
.auth-tabs button.active{background:var(--bg-elev);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.hint{font-size:12px;color:var(--text-faint);margin-top:6px;line-height:1.5;}

/* config screen (missing supabase config) */
#setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.setup-box{max-width:520px;width:100%;}

/* loading */
#boot-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:500;color:var(--text-dim);font-size:14px;}

/* today greeting */
.hero{margin-bottom:22px;}
.hero .greet{font-size:23px;font-weight:800;}
.hero .date{color:var(--text-dim);font-size:13.5px;margin-top:2px;text-transform:capitalize;}

/* control center stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-card .n{font-size:24px;font-weight:800;}
.stat-card .l{font-size:12px;color:var(--text-dim);margin-top:2px;}
.bar-track{height:8px;border-radius:8px;background:var(--bg-sunken);overflow:hidden;margin-top:8px;}
.bar-fill{height:100%;background:var(--accent);border-radius:8px;}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-faint);font-weight:700;padding-bottom:4px;}
.cal-day{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;position:relative;background:var(--bg-elev);}
.cal-day.other{opacity:.32;}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:800;}
.cal-day.selected{background:var(--accent);color:var(--accent-text);}
.cal-day .dots{display:flex;gap:2px;margin-top:3px;}
.cal-day .dots span{width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-day.selected .dots span{background:var(--accent-text);}

/* progress bar in projects */
.proj-row .bar-track{margin-top:8px;}

/* search overlay */
#search-overlay{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;flex-direction:column;padding:14px;}
#search-overlay input{font-size:17px;border:none;border-bottom:2px solid var(--border);padding:10px 4px;background:none;color:var(--text);outline:none;}
#search-overlay input:focus{border-color:var(--accent);}
#search-results{margin-top:14px;overflow-y:auto;flex:1;}

.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
.sync-badge .dot{width:7px;height:7px;border-radius:50%;}

textarea, input[type=text], input[type=date], input[type=time], input[type=email], input[type=password]{-webkit-appearance:none;}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg-sunken);padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;display:block;}
.steps-list{display:flex;flex-direction:column;gap:10px;}
.step-num{display:flex;gap:12px;align-items:flex-start;}
.step-num .n{width:24px;height:24px;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.step-num .t{font-size:13.5px;line-height:1.5;padding-top:2px;}

hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0;}
.inline-note{font-size:12.5px;color:var(--text-faint);background:var(--bg-sunken);border-radius:8px;padding:10px 12px;line-height:1.5;}
</style>
</head>

<div id="boot-loading">Cargando MIDPLANER…</div>
<div id="toast-wrap"></div>
<div id="root" style="display:none;"></div>

<script>
/* ============================================================
   MIDPLANER — single file app
   Secciones: CONFIGURACIÓN · SUPABASE · AUTH · ESTADO · TAREAS
   RUTINAS · PROYECTOS · ESPERANDO · IDEAS · INBOX · UI ·
   SINCRONIZACIÓN · OFFLINE · NOTIFICACIONES · CALENDARIO · SQL
   ============================================================ */

/* ================= CONFIGURACIÓN ================= */
// Coloca aquí tu Project URL y tu clave Publishable/Anon si prefieres
// dejarlas fijas en el archivo. Si las dejas vacías, MIDPLANER te
// pedirá que las introduzcas y las guardará en este navegador
// (localStorage), sin modificar este archivo.
const SUPABASE_URL = "https://mtktdrmxervwqtespdhk.supabase.co";
const SUPABASE_ANON_KEY = ""; // Publishable Key (sb_publishable_...) o Anon key antigua (eyJ...). También puede configurarse en pantalla.
function normalizeSupabaseKey(key){
  return String(key || "").trim().replace(/^['"]|['"]$/g, "").trim();
}
function validateSupabaseConfig(url, key){
  const cleanUrl = String(url || "").trim().replace(/\/+$/, "");
  const cleanKey = normalizeSupabaseKey(key);
  if(!/^https:\/\/[^\s/]+\.supabase\.co$/i.test(cleanUrl)) return {ok:false, message:"Project URL no válida. Debe ser https://TU-PROYECTO.supabase.co"};
  if(!cleanKey || cleanKey.includes("...")) return {ok:false, message:"Falta la clave Publishable/Anon completa."};
  if(!(cleanKey.startsWith("sb_publishable_") || cleanKey.startsWith("eyJ"))) return {ok:false, message:"La clave debe comenzar con sb_publishable_ o eyJ."};
  return {ok:true, url:cleanUrl, key:cleanKey};
}

const TIMEZONE = "America/Mexico_City";
const LS_CONFIG = "midplanner_config";
const LS_CACHE_PREFIX = "midplanner_cache_";
const LS_QUEUE = "midplanner_queue";
const LS_THEME = "midplanner_theme";
const LS_NOTIF = "midplanner_notif_enabled";
const LS_NOTIF_ROUTINES = "midplanner_notif_routines"; // map routine_id -> bool

function getEffectiveConfig(){
  let stored = {};
  try{ stored = JSON.parse(localStorage.getItem(LS_CONFIG) || "{}"); }catch(e){}
  return {
    url: String(stored.url || SUPABASE_URL || "").trim().replace(/\/+$/, ""),
    key: normalizeSupabaseKey(stored.key || SUPABASE_ANON_KEY || "")
  };
}
function saveConfig(url, key){
  const clean = validateSupabaseConfig(url, key);
  if(!clean.ok) return clean;
  localStorage.setItem(LS_CONFIG, JSON.stringify({url:clean.url, key:clean.key}));
  return clean;
}

/* ================= FECHAS (zona horaria local, sin desliz UTC) ================= */
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtDateISO(d){ // yyyy-mm-dd usando componentes LOCALES del navegador
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function todayStr(){ return fmtDateISO(new Date()); }
function nowTimeStr(){ const d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function parseDateLocal(str){ // "yyyy-mm-dd" -> Date a medianoche LOCAL
  if(!str) return null;
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateStr, n){
  const d = parseDateLocal(dateStr); d.setDate(d.getDate()+n); return fmtDateISO(d);
}
function humanDate(str){
  if(!str) return "";
  const d = parseDateLocal(str);
  const opts = {weekday:'short', day:'numeric', month:'short'};
  return d.toLocaleDateString('es-MX', opts);
}
function longDateToday(){

function greeting(){
  const h = new Date().getHours();
  if(h < 12) return "Buenos días";

function isPast(dateStr, timeStr){
  if(!dateStr) return false;
  const t = todayStr();
  if(dateStr < t) return true;
  if(dateStr > t) return false;
  if(!timeStr) return false;
  return timeStr < nowTimeStr();
}
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0; const v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

/* ================= SUPABASE =================
   Cliente único (singleton). MIDPLANER debe crear el cliente de
   Supabase (y por lo tanto su GoTrueClient de Auth) UNA SOLA VEZ
   durante toda la ejecución. initClient() es idempotente: si ya
   existe una instancia (`sb`), la reutiliza y no vuelve a llamar
   createClient(), sin importar cuántas veces se invoque la función. */
function initClient(){
  if(sb) return true;
  const cfg = getEffectiveConfig();
  const check = validateSupabaseConfig(cfg.url, cfg.key);
  if(!check.ok) return false;
  if(!window.supabase || typeof window.supabase.createClient !== "function") {
    console.error("Supabase JS no está disponible.");
    return false;
  }
  try{
    sb = window.supabase.createClient(check.url, check.key, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storageKey: "midplanner-auth"
      },
      global: { headers: { "x-client-info": "midplaner-single-file/1.0" } }
    });
    return true;
  }catch(e){ console.error("Error creando cliente Supabase:", e); sb=null; return false; }
}

/* ================= TOASTS ================= */
function toast(msg, type){
  type = type || "info";
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast "+type;
  el.innerHTML = "<span>"+({ok:"✅",err:"⚠️",info:"ℹ️"}[type])+"</span><span>"+escapeHtml(msg)+"</span>";
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>el.remove(),200); }, 3200);
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ================= OFFLINE / CACHE / COLA ================= */
function cacheGet(table){ try{ return JSON.parse(localStorage.getItem(LS_CACHE_PREFIX+table)||"[]"); }catch(e){ return []; } }
function cacheSet(table, arr){ localStorage.setItem(LS_CACHE_PREFIX+table, JSON.stringify(arr)); }
function queueGet(){ try{ return JSON.parse(localStorage.getItem(LS_QUEUE)||"[]"); }catch(e){ return []; } }
function queueSet(q){ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }
function queuePush(op){ const q = queueGet(); q.push(op); queueSet(q); }

function setSyncStatus(s){
  state.syncStatus = s;
  renderSyncBadges();
}

window.addEventListener("online", ()=>{ state.online = true; processQueue(); });
window.addEventListener("offline", ()=>{ state.online = false; setSyncStatus("offline"); });

async function processQueue(){
  if(!state.online || !sb || !state.user) return;
  let q = queueGet();
  if(q.length === 0){ setSyncStatus("synced"); return; }
  setSyncStatus("syncing");
  const remaining = [];
  for(const op of q){
    try{
      if(op.type === "insert"){
        await sb.from(op.table).upsert(op.row);
      }else if(op.type === "update"){
        await sb.from(op.table).update(op.patch).eq("id", op.id).eq("user_id", state.user.id);
      }else if(op.type === "delete"){
        await sb.from(op.table).delete().eq("id", op.id).eq("user_id", state.user.id);
      }
    }catch(e){
      console.error("sync error", e);
      remaining.push(op);
    }
  }
  queueSet(remaining);
  if(remaining.length === 0){
    setSyncStatus("synced");
    await fetchAllTables();
  }else{
    setSyncStatus("offline");
  }
}

/* ================= CRUD GENÉRICO (con soporte offline) ================= */
async function fetchAllTables(){
  if(!sb || !state.user) return;
  setSyncStatus("syncing");
  try{
    for(const table of TABLES){
      const { data, error } = await sb.from(table).select("*").eq("user_id", state.user.id).order("created_at",{ascending:true});
      if(error) throw error;
      state.data[table] = data || [];
      cacheSet(table, state.data[table]);
    }
    setSyncStatus("synced");
  }catch(e){
    console.warn("fetch offline fallback", e);
    for(const table of TABLES){ state.data[table] = cacheGet(table); }
    setSyncStatus(state.online ? "synced" : "offline");
  }
  render();
}

function localApply(table, kind, row){
  const arr = state.data[table];
  if(kind === "insert"){ arr.push(row); }
  else if(kind === "update"){ const i = arr.findIndex(r=>r.id===row.id); if(i>-1) arr[i] = {...arr[i], ...row}; }
  else if(kind === "delete"){ const i = arr.findIndex(r=>r.id===row.id); if(i>-1) arr.splice(i,1); }
  cacheSet(table, arr);
}

async function insertRow(table, row){
  row.id = row.id || uuid();
  row.user_id = state.user.id;
  row.created_at = row.created_at || new Date().toISOString();
  localApply(table, "insert", row);
  render();
  if(!state.online){ queuePush({type:"insert", table, row}); setSyncStatus("offline"); return row; }
  try{
    const { error } = await sb.from(table).insert(row);
    if(error) throw error;
    setSyncStatus("synced");
  }catch(e){
    console.error(e); queuePush({type:"insert", table, row}); setSyncStatus("offline");
  }
  return row;
}
async function updateRow(table, id, patch){
  localApply(table, "update", {id, ...patch});
  render();
  if(!state.online){ queuePush({type:"update", table, id, patch}); setSyncStatus("offline"); return; }
  try{
    const { error } = await sb.from(table).update(patch).eq("id", id).eq("user_id", state.user.id);
    if(error) throw error;
    setSyncStatus("synced");
  }catch(e){
    console.error(e); queuePush({type:"update", table, id, patch}); setSyncStatus("offline");
  }
}
async function deleteRow(table, id){
  localApply(table, "delete", {id});
  render();
  if(!state.online){ queuePush({type:"delete", table, id}); setSyncStatus("offline"); return; }
  try{
    const { error } = await sb.from(table).delete().eq("id", id).eq("user_id", state.user.id);
    if(error) throw error;
    setSyncStatus("synced");
  }catch(e){
    console.error(e); queuePush({type:"delete", table, id}); setSyncStatus("offline");
  }
}

function setupRealtime(){
  if(!sb || !state.user) return;
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); }
  realtimeChannel = sb.channel("midplanner-changes");
  TABLES.forEach(table=>{
    realtimeChannel.on("postgres_changes", { event:"*", schema:"public", table, filter:`user_id=eq.${state.user.id}` }, (payload)=>{
      const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
      if(!row) return;
      if(payload.eventType === "DELETE"){ localApply(table,"delete",row); }
      else if(payload.eventType === "INSERT"){
        const exists = state.data[table].some(r=>r.id===row.id);
        if(!exists) localApply(table,"insert",row); else localApply(table,"update",row);
      } else { localApply(table,"update",row); }
      render();
    });
  });
  realtimeChannel.subscribe();
}

/* ================= RUTINAS: lógica de ocurrencias ================= */
function dowMatches(routine, dateStr){
  const d = parseDateLocal(dateStr);
  const day = d.getDay(); // 0=domingo
  const startDow = parseDateLocal(routine.start_date).getDay();
  switch(routine.frequency){
    case "DIARIA": return true;
    case "LUNES_A_VIERNES": return day>=1 && day<=5;
    case "SEMANAL": return day === startDow;
    case "CADA_2_SEMANAS": {
      const start = parseDateLocal(routine.start_date);
      const diffDays = Math.round((d - start) / 86400000);
      return day === startDow && Math.floor(diffDays/7) % 2 === 0;
    }
    case "MENSUAL": return d.getDate() === parseDateLocal(routine.start_date).getDate();
    case "PERSONALIZADA": {
      const days = (routine.custom_days || []).map(Number);
      return days.includes(day);
    }
    default: return false;
  }
}
function routineActiveOn(routine, dateStr){
  if(!routine.active) return false;
  if(dateStr < routine.start_date) return false;
  if(routine.end_date && dateStr > routine.end_date) return false;
  return dowMatches(routine, dateStr);
}
async function ensureOccurrence(routine, dateStr){
  let occ = state.data.routine_occurrences.find(o=>o.routine_id===routine.id && o.date===dateStr);
  if(occ) return occ;
  if(!routineActiveOn(routine, dateStr)) return null;
  occ = await insertRow("routine_occurrences", { routine_id: routine.id, date: dateStr, status: "PENDIENTE" });
  return occ;
}
async function ensureOccurrencesForRange(startStr, endStr){
  for(const routine of state.data.routines){
    let d = startStr;
    let guard = 0;
    while(d <= endStr && guard < 400){
      await ensureOccurrence(routine, d);
      d = addDays(d, 1);
      guard++;
    }
  }
}
function occurrencesOn(dateStr){
  return state.data.routine_occurrences.filter(o=>o.date===dateStr).map(o=>{
    const r = state.data.routines.find(rt=>rt.id===o.routine_id);
    return { occ:o, routine:r };
  }).filter(x=>x.routine);
}

/* ================= DERIVADOS ================= */
function tasksToday(){
  const t = todayStr();
  return state.data.tasks.filter(x=>x.status!=="COMPLETADA" && x.date===t);
}
function tasksOverdue(){
  const t = todayStr();
  return state.data.tasks.filter(x=>x.status!=="COMPLETADA" && x.date && x.date < t);
}
function tasksPriorityHighToday(){
  return tasksToday().filter(x=>x.priority==="ALTA");
}
function waitingFollowupsToday(){
  const t = todayStr();
  return state.data.waiting_items.filter(w=>(w.status==="ESPERANDO"||w.status==="DAR SEGUIMIENTO") && w.followup_date && w.followup_date<=t);
}
function projectProgress(p){
  const tasks = state.data.tasks.filter(t=>t.project_id===p.id);
  if(tasks.length===0) return {done:0,total:0,pct:0};
  const done = tasks.filter(t=>t.status==="COMPLETADA").length;
  return {done, total: tasks.length, pct: Math.round(done/tasks.length*100)};
}

function bindAuthScreen(){
  const diag = document.getElementById("auth-diagnose");
  if(diag) diag.onclick = ()=>{ const cfg=getEffectiveConfig(); testSupabaseConnection(cfg.url,cfg.key,document.getElementById("auth-test-result")); };
  let mode = "login";
  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const submit = document.getElementById("auth-submit");
  tabLogin.onclick = ()=>{ mode="login"; tabLogin.classList.add("active"); tabSignup.classList.remove("active"); submit.textContent="Iniciar sesión"; };
  tabSignup.onclick = ()=>{ mode="signup"; tabSignup.classList.add("active"); tabLogin.classList.remove("active"); submit.textContent="Crear cuenta"; };
  submit.onclick = async ()=>{
    const email = document.getElementById("auth-email").value.trim();

      let ok;
      if(mode==="signup") ok = await doSignUp(email, pass);

      if(ok){
        if(hint) hint.textContent = "Sesión iniciada. Cargando MIDPLANER…";

      toast(e?.message || "No se pudo iniciar sesión", "err");

    }

    // guarde una configuración, initClient() creará UNA nueva instancia
    // (no una adicional) porque `sb` ya no apunta a la anterior.
    if(realtimeChannel){ try{ sb && sb.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
    sb = null;
    renderRoot();
  };
}

async function afterLogin(){
  const { data, error } = await sb.auth.getSession();
  if(error) throw error;
  state.session = data.session;
  state.user = data.session ? data.session.user : null;
  if(!state.user){
    throw new Error("Supabase inició sesión pero no devolvió una sesión. Revisa la confirmación del correo.");
  }

  // Entrar a la aplicación NO debe depender de que las tablas estén creadas
  // o de que una consulta de datos tarde. Mostramos la interfaz inmediatamente.
  renderRoot();
  startNotificationLoop();
  setupRealtime();

  // Cargamos los datos después de mostrar la aplicación. Si alguna tabla aún
  // no existe, fetchAllTables usa la caché y no bloquea el acceso.
  try{
    await fetchAllTables();

  }
}

/* ================= RENDER DISPATCH ================= */
function render(){
  if(!state.user) return;
  renderNav();
  const titles = {
    hoy:["Hoy",""], inbox:["Inbox","Captura rápida, decide después"], tareas:["Tareas",""],
    rutinas:["Rutinas",""], proyectos:["Proyectos",""], esperando:["Esperando","Cosas que dependen de otros"],
    ideas:["Ideas",""], calendario:["Calendario",""], control:["Centro de control",""], config:["Configuración",""]
  };
  const t = titles[state.view] || ["MIDPLANER",""];
  document.getElementById("view-title").textContent = t[0];
  document.getElementById("view-sub").textContent = state.view==="hoy" ? longDateToday() : t[1];
  const content = document.getElementById("view-content");
  const renderers = {
    hoy: renderHoy, inbox: renderInbox, tareas: renderTareas, rutinas: renderRutinas,
    proyectos: renderProyectos, esperando: renderEsperando, ideas: renderIdeas,

  };
  content.innerHTML = (renderers[state.view] || renderHoy)();

}

/* ================= VISTA: CALENDARIO ================= */
function renderCalendario(){
  const {y,m} = state.calMonth;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthLabel = first.toLocaleDateString('es-MX',{month:'long', year:'numeric'});
  let cells = "";
  const dows = ["D","L","M","M","J","V","S"];
  cells += dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const totalCells = Math.ceil((startDow+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startDow + 1;
    let dateObj, other=false;
    if(dayNum<1){ dateObj = new Date(y,m,dayNum); other=true; }
    else if(dayNum>daysInMonth){ dateObj = new Date(y,m,dayNum); other=true; }
    else { dateObj = new Date(y,m,dayNum); }
    const ds = fmtDateISO(dateObj);
    const isToday = ds===todayStr();
    const isSel = ds===state.calSelected;
    const hasItems = state.data.tasks.some(t=>t.date===ds) || occurrencesOn(ds).length>0 || state.data.waiting_items.some(w=>w.followup_date===ds);
    cells += `<div class="cal-day ${other?'other':''} ${isToday?'today':''} ${isSel?'selected':''}" data-cal-day="${ds}">
      <span>${dateObj.getDate()}</span>${hasItems?'<div class="dots"><span></span></div>':''}
    </div>`;
  }
  const sel = state.calSelected;
  const dayTasks = state.data.tasks.filter(t=>t.date===sel);
  const dayOcc = occurrencesOn(sel);
  const dayWaiting = state.data.waiting_items.filter(w=>w.followup_date===sel);
  return `
  <div class="cal-head">
    <button class="btn sm" id="cal-prev">‹</button>
    <div style="font-weight:700;text-transform:capitalize;">${monthLabel}</div>
    <button class="btn sm" id="cal-next">›</button>
  </div>
  <div class="cal-grid">${cells}</div>
  <hr class="sep">
  <div class="section-head"><h2>${humanDate(sel)}</h2></div>
  <div class="list">
    ${dayTasks.map(taskRowHtml).join("")}
    ${dayOcc.map(x=>occRowHtml(x.occ,x.routine)).join("")}
    ${dayWaiting.map(waitingRowHtml).join("")}
    ${(dayTasks.length+dayOcc.length+dayWaiting.length)===0 ? emptyHtml("Nada programado este día.") : ""}
  </div>
  `;
}

/* ================= VISTA: CENTRO DE CONTROL ================= */
function complianceRate(fromStr, toStr){
  let total=0, done=0;
  state.data.routine_occurrences.forEach(o=>{
    if(o.date>=fromStr && o.date<=toStr){ total++; if(o.status==="COMPLETADA") done++; }
  });
  return total ? Math.round(done/total*100) : 0;
}
function renderControl(){
  const t = todayStr();
  const pendientes = state.data.tasks.filter(x=>x.status!=="COMPLETADA").length;
  const vencidas = tasksOverdue().length;
  const completadasHoy = state.data.tasks.filter(x=>x.status==="COMPLETADA" && x.completed_at && x.completed_at.slice(0,10)===t).length;
  const rutinasHoy = occurrencesOn(t).length;
  const rutinasCompletadasHoy = occurrencesOn(t).filter(x=>x.occ.status==="COMPLETADA").length;
  const proyectosActivos = state.data.projects.filter(p=>p.status==="ACTIVO").length;
  const seguimientosPend = state.data.waiting_items.filter(w=>w.status==="ESPERANDO"||w.status==="DAR SEGUIMIENTO").length;
  const semanaInicio = addDays(t, -6);
  const mesInicio = addDays(t, -29);
  return `
  <div class="stat-grid" style="margin-bottom:24px;">
    ${statCard(pendientes,"Tareas pendientes")}
    ${statCard(vencidas,"Tareas vencidas")}
    ${statCard(completadasHoy,"Completadas hoy")}
    ${statCard(rutinasHoy+" ("+rutinasCompletadasHoy+")","Rutinas hoy (hechas)")}
    ${statCard(proyectosActivos,"Proyectos activos")}
    ${statCard(seguimientosPend,"Elementos esperando")}
  </div>
  <div class="section-head"><h2>Cumplimiento de rutinas</h2></div>
  <div class="list">
    ${complianceRow("Hoy", complianceRate(t,t))}
    ${complianceRow("Esta semana", complianceRate(semanaInicio,t))}
    ${complianceRow("Este mes", complianceRate(mesInicio,t))}
  </div>
  `;
}
function statCard(n,l){ return `<div class="stat-card"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
function complianceRow(label, pct){
  return `<div class="card"><div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;"><span>${label}</span><span>${pct}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
}

/* ================= SQL DE INSTALACIÓN ================= */
const SQL_SETUP = `-- =========================================================
-- MIDPLANER — SQL de instalación (ejecutar una sola vez)
-- =========================================================

create extension if not exists "pgcrypto";

-- ---------- profiles ----------
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text,
  created_at timestamptz default now()
);
alter table public.profiles enable row level security;
create policy "profiles_select_own" on public.profiles for select using (auth.uid() = id);
create policy "profiles_insert_own" on public.profiles for insert with check (auth.uid() = id);
create policy "profiles_update_own" on public.profiles for update using (auth.uid() = id);

-- ---------- tasks ----------
create table if not exists public.tasks (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null references auth.users(id) on delete cascade,
  title text not null,
  description text,
  category text check (category in ('TRABAJO','PERSONAL')),
  project_id uuid,
  priority text check (priority in ('ALTA','MEDIA','BAJA')),
  date date,
  time time,
  status text not null default 'PENDIENTE' check (status in ('PENDIENTE','EN PROGRESO','ESPERANDO','COMPLETADA')),
  completed_at timestamptz,
  is_demo boolean default false,
  created_at timestamptz default now()
);
create index if not exists tasks_user_idx on public.tasks(user_id);
create index if not exists tasks_date_idx on public.tasks(date);
alter table public.tasks enable row level security;
create policy "tasks_all_own" on public.tasks for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

-- ---------- routines ----------
create table if not exists public.routines (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null references auth.users(id) on delete cascade,
  name text not null,
  description text,
  category text check (category in ('TRABAJO','PERSONAL')),
  time time,
  frequency text check (frequency in ('DIARIA','LUNES_A_VIERNES','SEMANAL','CADA_2_SEMANAS','MENSUAL','PERSONALIZADA')),
  custom_days jsonb,
  start_date date not null default current_date,
  end_date date,
  active boolean default true,
  notify boolean default false,
  is_demo boolean default false,
  created_at timestamptz default now()
);

/* Prueba real, sin adivinar: llama directo a /auth/v1/settings (endpoint público
   de GoTrue) con la URL y la clave que estén en los campos de esta pantalla en
   este momento — no depende de si ya se guardaron ni de la instancia `sb`
   existente, para poder diagnosticar antes de decidir guardar. */
async function testSupabaseConnection(url, key, targetBox){
  const box = targetBox || document.getElementById("cfg-test-result") || document.getElementById("auth-test-result");
  const clean = validateSupabaseConfig(url, key);
  if(!clean.ok){ box.innerHTML = `<div class="inline-note" style="color:var(--danger);">⚠️ ${escapeHtml(clean.message)}</div>`; return; }
  box.innerHTML = `<div class="inline-note">Probando conexión con Supabase…</div>`;
  try{
    const headers = {
      apikey: clean.key,
      Authorization: `Bearer ${clean.key}`,
      Accept: "application/json"
    };
    const res = await fetch(clean.url + "/auth/v1/settings", {method:"GET", headers, cache:"no-store"});
    const text = await res.text();
    const fingerprint = clean.key.length > 12 ? `${clean.key.slice(0,4)}…${clean.key.slice(-4)} (${clean.key.length} caracteres)` : "clave corta";
    if(res.ok){
      box.innerHTML = `<div class="inline-note" style="color:var(--ok);">✅ Supabase respondió correctamente (HTTP ${res.status}).<br>Clave detectada: <code>${escapeHtml(fingerprint)}</code></div>`;
    }else{
      box.innerHTML = `<div class="inline-note" style="color:var(--danger);">⚠️ Supabase respondió HTTP ${res.status}.<br><code style="word-break:break-all;">${escapeHtml(text)}</code><br><small>Clave detectada: ${escapeHtml(fingerprint)}</small></div>`;
    }
  }catch(e){
    box.innerHTML = `<div class="inline-note" style="color:var(--danger);">🔴 No se pudo completar la petición.<br><small>${escapeHtml(e.message||String(e))}</small><br>Si esto ocurre al abrir el HTML localmente, prueba abrirlo en Chrome/Edge y verifica que tu red permita conexiones a Supabase.</div>`;
  }
}

async function toggleTask(id){
  const t = state.data.tasks.find(x=>x.id===id);
  if(!t) return;
  if(t.status==="COMPLETADA") await updateRow("tasks", id, {status:"PENDIENTE", completed_at:null});
  else await updateRow("tasks", id, {status:"COMPLETADA", completed_at:new Date().toISOString()});
}
async function toggleOccurrence(id){
  const o = state.data.routine_occurrences.find(x=>x.id===id);
  if(!o) return;
  if(o.status==="COMPLETADA") await updateRow("routine_occurrences", id, {status:"PENDIENTE", completed_at:null});
  else await updateRow("routine_occurrences", id, {status:"COMPLETADA", completed_at:new Date().toISOString()});
}

/* ================= NOTIFICACIONES ================= */
async function toggleNotifications(){
  const enabled = localStorage.getItem(LS_NOTIF) === "1";
  if(enabled){ localStorage.setItem(LS_NOTIF,"0"); toast("Notificaciones desactivadas","info"); render(); return; }
  if(!("Notification" in window)){ toast("Tu navegador no soporta notificaciones","err"); return; }
  const perm = await Notification.requestPermission();
  if(perm==="granted"){ localStorage.setItem(LS_NOTIF,"1"); toast("Notificaciones activadas","ok"); }
  else toast("Permiso de notificaciones denegado","err");
  render();
}
let notifiedToday = {};
function startNotificationLoop(){
  setInterval(()=>{
    if(localStorage.getItem(LS_NOTIF) !== "1") return;
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const now = nowTimeStr();
    const t = todayStr();
    occurrencesOn(t).forEach(({occ,routine})=>{
      if(!routine.notify || occ.status==="COMPLETADA") return;
      if(routine.time && routine.time.slice(0,5) === now){
        const key = routine.id+"_"+t;
        if(notifiedToday[key]) return;
        notifiedToday[key] = true;
        try{ new Notification("🔔 MIDPLANER", {body: routine.name.toUpperCase()+"\nEs momento de realizar tu rutina."}); }catch(e){}
      }
    });
  }, 30000);
}

function openSheet(title, bodyHtml, bindFn){
  closeSheet();
  const ov = document.createElement("div");

  ov.innerHTML = `<div class="sheet"><div class="sheet-head"><h3>${title}</h3><span class="x" id="sheet-close">×</span></div>${bodyHtml}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", (e)=>{ if(e.target===ov) closeSheet(); });
  document.getElementById("sheet-close").onclick = closeSheet;
  if(bindFn) bindFn(ov);
}

/* ---------- Detalle / apertura por tipo ---------- */
function openDetail(type, id){
  if(type==="task"){ const t = state.data.tasks.find(x=>x.id===id); if(t) openTaskForm(t); }
  else if(type==="routine"){ const r = state.data.routines.find(x=>x.id===id); if(r) openRoutineForm(r); }
  else if(type==="project"){ const p = state.data.projects.find(x=>x.id===id); if(p) openProjectForm(p); }
  else if(type==="waiting"){ const w = state.data.waiting_items.find(x=>x.id===id); if(w) openWaitingForm(w); }
  else if(type==="idea"){ const i = state.data.ideas.find(x=>x.id===id); if(i) openIdeaForm(i); }
  else if(type==="inbox"){ openInboxDetail(id); }
}
function openInboxDetail(id){
  const item = state.data.inbox_items.find(x=>x.id===id);
  if(!item) return;
  openSheet("Decidir qué es", `
    <p style="margin-top:0;font-weight:600;">${escapeHtml(item.title)}</p>
    <div class="quick-opts">
      <div class="quick-opt" data-conv="task"><span class="ic">📋</span>Convertir en tarea</div>
      <div class="quick-opt" data-conv="project"><span class="ic">📁</span>Convertir en proyecto</div>
      <div class="quick-opt" data-conv="waiting"><span class="ic">⏳</span>Convertir en esperando</div>
      <div class="quick-opt" data-conv="idea"><span class="ic">💡</span>Convertir en idea</div>
      <div class="quick-opt" data-conv="delete"><span class="ic">🗑️</span>Eliminar</div>
    </div>
  `, (ov)=>{
    ov.querySelectorAll("[data-conv]").forEach(el=>{
      el.onclick = async ()=>{
        const kind = el.dataset.conv;
        closeSheet();
        if(kind==="delete"){ await deleteRow("inbox_items", item.id); toast("Eliminado","ok"); render(); return; }
        await deleteRow("inbox_items", item.id);
        if(kind==="task") openTaskForm({title:item.title});
        else if(kind==="project") openProjectForm({name:item.title});
        else if(kind==="waiting") openWaitingForm({what:item.title});
        else if(kind==="idea") openIdeaForm({title:item.title});
      };
    });
  });
}

/* ================= BÚSQUEDA GLOBAL ================= */
function openSearch(){
  const ov = document.createElement("div");
  ov.id = "search-overlay";
  ov.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <input id="search-input" type="text" placeholder="Buscar tareas, rutinas, proyectos…" autofocus>
      <button class="btn icon" id="search-close">×</button>
    </div>
    <div id="search-results"></div>
  `;
  document.body.appendChild(ov);
  document.getElementById("search-close").onclick = ()=>ov.remove();
  const input = document.getElementById("search-input");
  input.oninput = ()=>renderSearchResults(input.value.trim().toLowerCase());
  setTimeout(()=>input.focus(), 50);
}
function renderSearchResults(q){
  const box = document.getElementById("search-results");
  if(!q){ box.innerHTML = ""; return; }
  const results = [];
  state.data.tasks.forEach(t=>{ if((t.title+" "+(t.description||"")).toLowerCase().includes(q)) results.push({type:"Tarea",row:t,html:taskRowHtml(t)}); });
  state.data.routines.forEach(r=>{ if((r.name+" "+(r.description||"")).toLowerCase().includes(q)) results.push({type:"Rutina",row:r,html:routineRowHtml(r)}); });
  state.data.projects.forEach(p=>{ if((p.name+" "+(p.description||"")).toLowerCase().includes(q)) results.push({type:"Proyecto",row:p,html:projectRowHtml(p)}); });
  state.data.waiting_items.forEach(w=>{ if((w.what+" "+(w.person||"")).toLowerCase().includes(q)) results.push({type:"Esperando",row:w,html:waitingFullRowHtml(w)}); });
  state.data.ideas.forEach(i=>{ if((i.title+" "+(i.description||"")).toLowerCase().includes(q)) results.push({type:"Idea",row:i,html:ideaRowHtml(i)}); });
  box.innerHTML = results.length ? `<div class="list">${results.map(r=>r.html).join("")}</div>` : emptyHtml("Sin resultados.");
  box.querySelectorAll("[data-open]").forEach(el=>{
    el.onclick = ()=>{ document.getElementById("search-overlay").remove(); openDetail(el.dataset.open, el.dataset.id); };
  });
}

/* ================= BOOT ================= */
async function boot(){
  applyTheme();
  if(!initClient()){
    renderRoot();
    return;
  }
  try{
    const { data } = await sb.auth.getSession();
    state.session = data.session;
    state.user = data.session ? data.session.user : null;
  }catch(e){ console.warn(e); }
  if(state.user){
    setupRealtime();
    await fetchAllTables();
    await ensureOccurrencesForRange(addDays(todayStr(),-1), addDays(todayStr(),14));
    startNotificationLoop();
  }
  renderRoot();
  if(sb){
    sb.auth.onAuthStateChange((event, session)=>{
      state.session = session;
      state.user = session ? session.user : null;
      if(state.user){
        // La sesión puede llegar por confirmación de correo o por sesión persistida.
        renderRoot();
      }else{
        renderRoot();
      }
    });
  }
}
document.addEventListener("DOMContentLoaded", boot);
window.addEventListener("supabase-ready", ()=>{ if(!sb) boot(); });
window.addEventListener("error", (ev)=>{
  const root=document.getElementById("root");
  const loading=document.getElementById("boot-loading");
  if(root && !root.innerHTML){
    if(loading) loading.style.display="none";
    root.style.display="block";
    root.innerHTML=`<div style="max-width:760px;margin:40px auto;padding:24px;font-family:system-ui,sans-serif;"><h2>MIDPLANER</h2><p>Ocurrió un error al cargar la aplicación.</p><pre style="white-space:pre-wrap;background:#f1f1ef;padding:12px;border-radius:8px;">${escapeHtml(ev.error?.message || ev.message || "Error desconocido")}</pre><p>Recarga la página. Si persiste, abre la consola del navegador para ver el detalle.</p></div>`;
  }
});
</script>
